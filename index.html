<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Interaktiver Pokedex mit Suche, Typ-Filter, Detail-Ansichten und Dark Mode. Vanilla JavaScript, basierend auf der PokéAPI."
    />
    <meta name="author" content="Aljoscha Naß" />
    <meta name="theme-color" content="#ef4444" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Pokedex – Vanilla-JS-Web-App" />
    <meta
      property="og:description"
      content="Interaktiver Pokedex mit Suche, Typ-Filter, Detail-Ansichten und Dark Mode."
    />
    <meta property="og:image" content="./assets/screenshots/preview.png" />
    <meta property="og:locale" content="de_DE" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pokedex – Vanilla-JS-Web-App" />
    <meta
      name="twitter:description"
      content="Interaktiver Pokedex mit Suche, Typ-Filter, Detail-Ansichten und Dark Mode."
    />
    <meta name="twitter:image" content="./assets/screenshots/preview.png" />

    <link rel="stylesheet" href="styles/theme.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="./styles/overlay.css" />
    <link rel="stylesheet" href="styles/standard.css" />
    <link rel="stylesheet" href="styles/color.css" />

    <title>Pokedex</title>
    <link rel="icon" type="image/x-icon" href="./assets/img/pokeball.png" />
  </head>
  <body id="body">
    <div id="content_wraper" class="content_wraper">
      <header>
        <div class="header">
          <div class="header_logo">
            <img src="./assets/img/pokeball.png" alt="pokeball" />
            <h1>Pokedex</h1>
          </div>
          <div class="searching_section">
            <button id="btn_search" class="btn_search" aria-label="Suchen">
              Suchen
            </button>
            <input
              id="searching"
              class="input_search"
              type="text"
              value=""
              placeholder="Suche..."
              aria-label="Pokémon suchen"
            />
            <button
              id="theme_toggle"
              class="theme_toggle"
              aria-label="Dark Mode aktivieren"
            >
              🌙
            </button>
          </div>
        </div>
      </header>

      <div class="loading_screen" id="loading_screen">
        <img src="./assets/img/pokeball.png" alt="Lade Pokédex" />
      </div>

      <div id="error_banner" class="error_banner d_none" role="alert"></div>

      <div id="content_max_width" class="content_max_width">
        <div
          id="type_filter"
          class="type_filter d_none"
          role="group"
          aria-label="Nach Typ filtern"
        ></div>
        <main id="content" class="content d_none"></main>
        <div id="btn_section" class="btn_section d_none">
          <button id="btn_load_more" class="btn_load_more">Mehr Laden</button>
        </div>
      </div>

      <div id="overlay" class="overlay d_none" role="dialog" aria-modal="true">
        <div id="singleOverlay" class="singleOverlay"></div>
      </div>

      <footer>
        <div class="footer">
          <div class="copyright">
            <p>Copyright 2025</p>
            <p>Aljoscha Naß</p>
          </div>
          <div class="links">
            <a href="html/impressum.html">Impressum</a>
            <a href="html/datenschutz.html">Datenschutz</a>
          </div>
        </div>
      </footer>
    </div>

    <script src="./scripts/state.js"></script>
    <script src="./scripts/storage.js"></script>
    <script src="./scripts/api.js"></script>
    <script src="./scripts/templates.js"></script>
    <script src="./scripts/render.js"></script>
    <script src="./scripts/events.js"></script>
    <script src="./scripts/main.js"></script>
  </body>
</html>
